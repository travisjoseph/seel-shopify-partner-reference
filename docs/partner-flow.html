<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seel Shopify partner integration flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #f7f5ff; color: #2f2c28; padding: 3rem 2rem; display: flex; justify-content: center; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Fira Code', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #5e587a; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
    .lane { stroke: #e3e0ec; stroke-width: 1; }
    .lane-strong { stroke: #c9c5d6; stroke-width: 1; }
    .lane-lbl { fill: #5e587a; font-family: 'Fira Code', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.18em; }
    .stage { fill: #6b6587; font-family: 'Fira Code', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.18em; }
    .n-mask { fill: #f7f5ff; }
    .n { fill: #ffffff; stroke: #2f2c28; stroke-width: 1; }
    .n-focal { fill: #eeeefb; stroke: #5254da; stroke-width: 1.4; }
    .n-gone { fill: #ffffff; stroke: #6b6587; stroke-width: 1; stroke-dasharray: 4,3; }
    .nm { fill: #2f2c28; font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .sb { fill: #5e587a; font-family: 'Fira Code', ui-monospace, monospace; font-size: 8.5px; }
    .arr { fill: none; stroke: #5e587a; stroke-width: 1.2; }
    .arr-dash { fill: none; stroke: #5e587a; stroke-width: 1.2; stroke-dasharray: 5,4; }
    .arr-acc { fill: none; stroke: #5254da; stroke-width: 1.5; }
    .mk { fill: #5e587a; }
    .mk-acc { fill: #5254da; }
    .lmask { fill: #f7f5ff; }
    .al { fill: #5e587a; font-family: 'Fira Code', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; }
    .al-acc { fill: #5254da; font-family: 'Fira Code', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; }
    .lg { fill: #5e587a; font-family: 'DM Sans', system-ui, sans-serif; font-size: 9px; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Seel · Shopify partner integration</p>
    <h1>Seel Shopify partner integration flow</h1>
    <div class="scroll">
      <svg viewBox="0 0 1000 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="partner-flow-title partner-flow-desc">
      <title id="partner-flow-title">Seel Shopify partner integration flow</title>
      <desc id="partner-flow-desc">Swimlane of a Shopify partner integration: the partner app registers the merchant, quotes the cart, and forwards raw Shopify order webhooks; Seel mints the contract, emails the shopper, sends contract webhooks back, and runs claims and payouts in its Resolution Center.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#e6e3ef"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk-acc" points="0 0, 8 3, 0 6"/></marker>
      </defs>
<rect width="1000" height="384" fill="#f7f5ff"/>
<rect width="1000" height="384" fill="url(#dots)" opacity="0.55"/>

<text class="stage" x="906" y="56" text-anchor="middle">CLAIM</text>

<text class="lane-lbl" x="40" y="115">SHOPPER</text>
<text class="lane-lbl" x="40" y="195">PARTNER APP</text>
<text class="lane-lbl" x="40" y="275">SEEL</text>
<line class="lane" x1="32" y1="332" x2="976" y2="332"/>
<path class="arr" d="M290,192 H336" marker-end="url(#arrow)"/>
<path class="arr" d="M398,168 V138" marker-end="url(#arrow)"/>
<path class="arr" d="M458,112 H558 Q566,112 566,120 V166" marker-end="url(#arrow)"/>
<path class="arr" d="M546,216 V246" marker-end="url(#arrow)"/>
<path class="arr-dash" d="M586,248 V218" marker-end="url(#arrow)"/>
<path class="arr" d="M626,192 H672" marker-end="url(#arrow)"/>
<path class="arr" d="M734,216 V264 Q734,272 726,272 H628" marker-end="url(#arrow)"/>

<rect class="lmask" x="484" y="92" width="52" height="12" rx="2"/>

<rect class="lmask" x="506" y="225" width="32" height="12" rx="2"/>

<rect class="lmask" x="594" y="227" width="50" height="12" rx="2"/>

<text class="sb" x="398" y="204" text-anchor="middle">cart.js + browser_ip</text>

<text class="nm" x="906" y="269" text-anchor="middle">Seel RC + payout</text>
